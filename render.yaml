# Render blueprint for the Django API. The React app is deployed separately
# (e.g. Vercel) with VITE_API_URL pointing at this service.
services:
  - type: web
    name: truck-routing-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: NUM_PROXIES # Render's load balancer sets X-Forwarded-For
        value: "1"
      - key: TRUST_CDN_IP_HEADERS # Render sits behind Cloudflare, which sets CF-Connecting-IP
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the frontend URL, e.g. https://your-app.vercel.app
      - key: REPO_URL # contact URL in the User-Agent sent to OSRM, Photon and Nominatim
        value: https://github.com/Faizan404/weather-aware-truck-routing
      - key: PLAN_DEADLINE_SECONDS
        value: "60" # keep below gunicorn's --timeout (90) in the Dockerfile
      # The version in /api/v1/health/ comes from Render's RENDER_GIT_COMMIT.
